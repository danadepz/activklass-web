<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      One text face, one code face — nothing else is loaded on purpose.

      This used to be three <link>s: Inter + Lexend, Plus Jakarta Sans +
      JetBrains Mono, and DM Serif Display for headings. A tester read the
      serif-heading / sans-body pairing as inconsistency and asked for a single
      sans-serif throughout, and the owner took it, so headings now use the body
      face at a heavier weight (theme.js `heading`, and the h1-h4 rule in
      index.css). Inter, Lexend and DM Serif Display render nowhere any more, so
      loading them was two round trips buying nothing.

      The 400-800 range is not spare: 700 is what carries every heading now that
      no face change marks one out, and the lighter steps are body and captions.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>ActivKlass — AI-Powered Class Record System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
